# Lychee configuration for docs site link checking
# Run offline — only validate local file structure
offline = true

# Treat trailing-slash directories as index.html
index_files = ["index.html"]

# Exclude the site's own canonical URLs (generated by Astro in meta tags)
# These are validated by the local file check via root-relative paths
exclude = [
  "^https://scottschreckengaust\\.github\\.io/",
  "^data:"
]
